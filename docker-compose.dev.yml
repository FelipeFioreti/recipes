# Ambiente de desenvolvimento local: migrations + API + frontend, com hot reload.
# Nao e usado em producao (ver deploy/docker-compose.yml e chefarchive-infra).
#
# Requer o repositorio chefarchive-web clonado ao lado deste (../chefarchive-web) e
# src/Recipes.Api/appsettings.Development.json (copie de appsettings.Development.example.json).
# O banco e a connection string desse arquivo; as migrations sao aplicadas nele a cada subida.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Frontend: http://localhost:4200 | API: http://localhost:5184

name: chefarchive-dev

services:
  migration:
    build:
      context: .
      dockerfile: src/Recipes.Api/Dockerfile.migrations
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppSettings__Secret: migration-only-placeholder-secret-0123456789
    volumes:
      - ./src/Recipes.Api/appsettings.Development.json:/src/src/Recipes.Api/appsettings.Development.json:ro

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    command: dotnet watch run --project src/Recipes.Api --no-launch-profile --non-interactive
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      UseArtifactsOutput: "true"
      ArtifactsPath: /artifacts
    ports:
      - "5184:8080"
    volumes:
      - .:/src
      - api-artifacts:/artifacts
      - nuget-cache:/root/.nuget/packages
    depends_on:
      migration:
        condition: service_completed_successfully

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "[ -d node_modules/@angular ] || npm ci; npm start -- --host 0.0.0.0 --poll 1000"
    ports:
      - "4200:4200"
    volumes:
      - ../chefarchive-web:/app
      # node_modules e cache do Angular do Windows tem binarios nativos incompativeis com Linux.
      - web-node-modules:/app/node_modules
      - web-angular-cache:/app/.angular
    depends_on:
      - api

volumes:
  api-artifacts:
  nuget-cache:
  web-node-modules:
  web-angular-cache:
